name: IPA bauen
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Xcode-Projekt erzeugen
        run: |
          xcodebuild -version
          brew install xcodegen
          xcodegen generate
      - name: App bauen (unsigniert)
        run: |
          set -o pipefail
          xcodebuild -project Fitness.xcodeproj -scheme Fitness -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" 2>&1 | tee build.log
      - name: Fehler anzeigen
        if: failure()
        run: grep -E "error:" build.log | sort -u | head -40
      - name: IPA packen
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/Fitness.app Payload/
          zip -qr Fitness.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Fitness-IPA
          path: Fitness.ipa
